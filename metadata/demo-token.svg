<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GrillCoin">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A32"/>
      <stop offset="100%" stop-color="#14141A"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B2C"/>
      <stop offset="55%" stop-color="#FF9A1F"/>
      <stop offset="100%" stop-color="#FFD53E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#coin)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#rim)" stroke-width="16"/>

  <!-- flame -->
  <path fill="url(#flame)" d="M256 112c14 46-6 66-28 88-26 26-54 50-54 96a82 82 0 0 0 164 0c0-30-14-52-28-70-6 16-16 26-28 30 12-40 4-98-26-144z"/>
  <path fill="#FFE9A8" opacity=".85" d="M256 244c8 24-2 34-13 46-13 14-21 26-21 44a34 34 0 0 0 68 0c0-18-10-32-20-44-8-10-14-28-14-46z"/>

  <!-- grill bars -->
  <g stroke="#7A7A88" stroke-width="14" stroke-linecap="round">
    <line x1="150" y1="386" x2="362" y2="386"/>
    <line x1="168" y1="418" x2="344" y2="418"/>
  </g>
</svg>
